<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="35%" stop-color="#071938" />
      <stop offset="70%" stop-color="#0b2347" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>

    <!-- Grid / Bathymetry Gradients -->
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="radar-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="route-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f274a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#061830" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow-route" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing1 {
        0%, 100% { r: 18px; opacity: 0.8; }
        50% { r: 38px; opacity: 0.15; }
      }
      @keyframes pulseRing2 {
        0%, 100% { r: 14px; opacity: 0.8; }
        50% { r: 30px; opacity: 0.2; }
      }
      @keyframes routeDash {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveDrift {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-35px); }
        100% { transform: translateX(0px); }
      }
      @keyframes vesselMove {
        0% { transform: translate(180px, 310px); }
        25% { transform: translate(450px, 280px); }
        50% { transform: translate(720px, 320px); }
        75% { transform: translate(960px, 290px); }
        100% { transform: translate(180px, 310px); }
      }
      @keyframes floatSubtle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .animated-radar {
        transform-origin: 1040px 100px;
        animation: radarSweep 10s linear infinite;
      }
      .animated-route {
        stroke-dasharray: 12 8;
        animation: routeDash 6s linear infinite;
      }
      .animated-wave {
        animation: waveDrift 14s ease-in-out infinite;
      }
      .pulse-beacon-1 {
        animation: pulseRing1 3s ease-in-out infinite;
      }
      .pulse-beacon-2 {
        animation: pulseRing2 2.5s ease-in-out infinite;
      }
      .floating-tag {
        animation: floatSubtle 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- 2. Dynamic Background: Nautical Coordinate Grid & Compass Overlay -->
  <g opacity="0.4">
    <!-- Latitude / Longitude Lines -->
    <path d="M 0 60 L 1200 60 M 0 130 L 1200 130 M 0 200 L 1200 200 M 0 270 L 1200 270 M 0 340 L 1200 340" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.3" />
    <path d="M 150 0 L 150 420 M 350 0 L 350 420 M 550 0 L 550 420 M 750 0 L 750 420 M 950 0 L 950 420 M 1100 0 L 1100 420" stroke="#0284c7" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.3" />
  </g>

  <!-- 3. Dynamic Background: Radar Station in Upper Right -->
  <g opacity="0.6">
    <circle cx="1040" cy="100" r="110" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 5" opacity="0.3" />
    <circle cx="1040" cy="100" r="75" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.4" />
    <circle cx="1040" cy="100" r="40" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" />
    <line x1="930" y1="100" x2="1150" y2="100" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />
    <line x1="1040" y1="-10" x2="1040" y2="210" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" />
    
    <!-- Rotating Radar Beam -->
    <g class="animated-radar">
      <path d="M 1040 100 L 1150 100 A 110 110 0 0 0 1120 25 Z" fill="url(#radar-beam-grad)" />
    </g>
    <!-- Radar Center Blip -->
    <circle cx="1040" cy="100" r="4" fill="#38bdf8" />
    <circle cx="1040" cy="100" r="14" fill="none" stroke="#38bdf8" class="pulse-beacon-2" />
  </g>

  <!-- 4. Dynamic Background: Animated Sea Waves & Ocean Currents -->
  <g class="animated-wave" opacity="0.25">
    <path d="M -50 350 Q 150 320 350 350 T 750 350 T 1150 350 T 1550 350 L 1550 420 L -50 420 Z" fill="#0284c7" />
    <path d="M -30 370 Q 170 345 370 370 T 770 370 T 1170 370 T 1570 370 L 1570 420 L -30 420 Z" fill="#0369a1" />
  </g>

  <!-- 5. Dynamic Background: Vessel Route Waypoints & Flowing Path -->
  <g>
    <!-- Background Glow Route Path -->
    <path d="M 120 330 C 320 270, 480 370, 680 300 S 960 340, 1120 270" fill="none" stroke="#0369a1" stroke-width="6" opacity="0.3" filter="url(#glow-route)" />
    <!-- Active Animated Route Line -->
    <path d="M 120 330 C 320 270, 480 370, 680 300 S 960 340, 1120 270" fill="none" stroke="url(#route-grad)" stroke-width="3" class="animated-route" filter="url(#glow-route)" />

    <!-- Waypoint 1 (Port of Departure) -->
    <circle cx="120" cy="330" r="6" fill="#38bdf8" />
    <circle cx="120" cy="330" r="18" fill="none" stroke="#38bdf8" class="pulse-beacon-1" />
    <text x="120" y="360" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">WAYPOINT 01 (ORIGIN)</text>

    <!-- Waypoint 2 (Mid-Voyage Weather Optimization) -->
    <circle cx="680" cy="300" r="6" fill="#06b6d4" />
    <circle cx="680" cy="300" r="18" fill="none" stroke="#06b6d4" class="pulse-beacon-1" />
    <text x="680" y="275" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">OPTIMAL ISOROUTE (WEATHER CORRIDOR)</text>

    <!-- Waypoint 3 (Destination Port) -->
    <circle cx="1120" cy="270" r="6" fill="#10b981" />
    <circle cx="1120" cy="270" r="18" fill="none" stroke="#10b981" class="pulse-beacon-1" />
    <text x="1120" y="300" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DESTINATION PORT</text>
  </g>

  <!-- 6. FOREGROUND CONTENT: Header, Title, Subtitle & Interactive Badge Cards -->
  <!-- Top Tagline -->
  <g class="floating-tag">
    <rect x="60" y="45" width="370" height="30" rx="15" fill="#0f294d" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="78" cy="60" r="5" fill="#38bdf8" />
    <text x="94" y="65" fill="#7dd3fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">⚓ MARITIME FREIGHT ROUTE OPTIMIZATION</text>
  </g>

  <!-- Main Title (Guaranteed in foreground, crystal clear) -->
  <g>
    <text x="60" y="130" fill="url(#title-grad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
      Awesome Marine Freight Route Optimization Engines
    </text>
  </g>

  <!-- Subtitle -->
  <g>
    <text x="60" y="172" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Curated Directory of Commercial SaaS &amp; Open-Source Ship Weather Routing, Fuel Optimization &amp; Decarbonization Engines
    </text>
  </g>

  <!-- Foreground Highlights / Feature Cards -->
  <g transform="translate(60, 205)">
    <!-- Pill 1: Weather Routing -->
    <g transform="translate(0, 0)">
      <rect width="200" height="42" rx="10" fill="url(#pill-bg)" stroke="#0284c7" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🌊 Weather Routing</text>
    </g>

    <!-- Pill 2: Fuel & Bunker Efficiency -->
    <g transform="translate(215, 0)">
      <rect width="220" height="42" rx="10" fill="url(#pill-bg)" stroke="#0284c7" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⛽ Bunker Consumption Opt</text>
    </g>

    <!-- Pill 3: CII & Decarbonization -->
    <g transform="translate(450, 0)">
      <rect width="205" height="42" rx="10" fill="url(#pill-bg)" stroke="#059669" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🌱 CII &amp; FuelEU Compliance</text>
    </g>

    <!-- Pill 4: AIS & Ocean Modeling -->
    <g transform="translate(670, 0)">
      <rect width="205" height="42" rx="10" fill="url(#pill-bg)" stroke="#0284c7" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🛰️ AIS &amp; Copernicus Data</text>
    </g>

    <!-- Pill 5: Open-Source Engines -->
    <g transform="translate(890, 0)">
      <rect width="195" height="42" rx="10" fill="url(#pill-bg)" stroke="#818cf8" stroke-width="1" filter="url(#card-shadow)" />
      <text x="16" y="26" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">💻 Open-Source Solvers</text>
    </g>
  </g>

  <!-- Border Outline Accent -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.3" />
</svg>
